name: Deploy

on:
  push:
    branches: [main]
  # Rebuild hourly so prices, volumes and new/upcoming assets stay fresh
  # (matches the 1h revalidation the Next.js version used).
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Astro's CLI runs on Node; bun manages dependencies and scripts.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Fails if Numia/GitHub data can't be loaded, leaving the last good
      # deployment live instead of publishing empty sections.
      - run: bun run build
        env:
          GTAG_ID: ${{ vars.GTAG_ID }}
          NUMIA_BASE_URL: ${{ vars.NUMIA_BASE_URL }}
          NUMIA_API_KEY: ${{ secrets.NUMIA_API_KEY }}
      - run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
